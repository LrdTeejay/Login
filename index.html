<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignUp Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<section>
    <header><h2>Create Account</h2></header>
    <form id="form">
        <label for="fullname">Full Name</label>
        <input type="text" placeholder="Surname, Firstname">
        <label for="date">Date of birth</label>
        <input type="date">
        <label for="gender">Gender</label>
        Male<input class="gender" name="gender" type="radio"> 
        Female <input class="gender" name="gender" type="radio">
        <label for="name">Username</label>
        <input id="myname" type="text" placeholder="username">
        <label for="password">Password</label>
        <input id="password" type="password" placeholder="password">
        <button class="Create">Sign Up</button>
    </form>
</section>
    <script src="index.js"></script>
</body>
</html>
